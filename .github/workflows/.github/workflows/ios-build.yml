name: Build Versus for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "resources/**"
      - "CMakeLists.txt"
      - "mod.json"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS (${{ matrix.edition }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        edition:
          - standard
          - membership

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Versus for iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
          target: iOS
          configure-args: >-
            -DVERSUS_MEMBERSHIP=${{ matrix.edition == 'membership' && 'ON' || 'OFF' }}

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: versus-ios-${{ matrix.edition }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
